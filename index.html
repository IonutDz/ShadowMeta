<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ShadowMeta — Builds, runas y maestrías de League of Legends</title>
  <meta name="description" content="Builds, páginas de runas, maestrías y tier lists de League of Legends: de la Season 1 a LoL Classic y el parche actual, en todos los modos de juego.">
  <meta name="theme-color" content="#010a13">
  <link rel="canonical" href="https://shadowmeta.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ShadowMeta">
  <meta property="og:title" content="ShadowMeta — Builds, runas y maestrías de League of Legends">
  <meta property="og:description" content="Los 61 campeones de LoL Classic con sus builds, páginas de runas y maestrías. Todas las eras, todos los modos.">
  <meta property="og:url" content="https://shadowmeta.vercel.app/">
  <meta property="og:image" content="https://shadowmeta.vercel.app/og.svg">
  <meta property="og:locale" content="es_ES">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ShadowMeta — Builds de League of Legends">
  <meta name="twitter:description" content="Los 61 campeones de LoL Classic con builds, runas y maestrías de todas las eras.">
  <meta name="twitter:image" content="https://shadowmeta.vercel.app/og.svg">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#mainView">Saltar al contenido</a>
  <p class="sr-only" id="liveRegion" aria-live="polite"></p>
  <header class="topbar">
    <div class="logo" id="logoHome" title="ShadowMeta — inicio">
      <svg class="logo-gem" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="logoOro" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f0e6d2"/>
            <stop offset="45%" stop-color="#c8aa6e"/>
            <stop offset="100%" stop-color="#785a28"/>
          </linearGradient>
          <linearGradient id="logoGema" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0ac8b9"/>
            <stop offset="100%" stop-color="#005a82"/>
          </linearGradient>
        </defs>
        <path d="M32 5 L55 13 V33 C55 46 44 55 32 59 C20 55 9 46 9 33 V13 Z"
              fill="none" stroke="url(#logoOro)" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M32 16 L43 24.5 L38.5 40 H25.5 L21 24.5 Z" fill="url(#logoGema)" opacity="0.92"/>
        <path d="M32 16 L43 24.5 L38.5 40 H25.5 L21 24.5 Z" fill="none" stroke="url(#logoOro)" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M21 24.5 H43 M32 16 V40" stroke="#010a13" stroke-width="1.5" opacity="0.5"/>
        <rect x="21" y="47" width="6" height="4" rx="1" fill="url(#logoOro)"/>
        <rect x="29" y="44.5" width="6" height="6.5" rx="1" fill="url(#logoOro)"/>
        <rect x="37" y="42" width="6" height="9" rx="1" fill="url(#logoOro)"/>
      </svg>
      <span class="logo-text">
        <span class="logo-main"><span class="logo-shadow">SHADOW</span><span class="logo-meta">META</span></span>
        <span class="logo-tagline">TODAS LAS ERAS · TODOS LOS MODOS</span>
      </span>
    </div>

    <nav class="main-nav" id="mainNav">
      <button class="nav-btn active" data-view="champions">Campeones</button>
      <button class="nav-btn" data-view="tierlist">Tier List</button>
      <button class="nav-btn" data-view="seasons">Eras</button>
    </nav>

    <button class="theme-btn" id="themeBtn" title="Cambiar entre tema claro y oscuro" aria-label="Cambiar tema">🌙</button>


  </header>

  <!-- Buscador principal, centrado -->
  <div class="search-hero">
    <div class="searchbox">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input type="text" id="searchInput" placeholder="Busca un campeón, una build, una era o un modo…" autocomplete="off" spellcheck="false">
      <kbd class="search-kbd">/</kbd>
      <div class="autocomplete" id="autocomplete"></div>
    </div>
  </div>

  <!-- Selector global de contexto -->
  <section class="context-bar" id="contextBar">
    <div class="context-selects">
      <label class="ctx-field">
        <span class="ctx-label">Era</span>
        <select id="edicionSelect"></select>
      </label>
      <label class="ctx-field">
        <span class="ctx-label">Modo</span>
        <select id="modoSelect"></select>
      </label>
    </div>
    <div class="context-desc" id="contextDesc"></div>
  </section>

  <nav class="role-filter" id="roleFilter">
    <button class="role-btn active" data-role="all">Todos</button>
    <button class="role-btn" data-role="Top">Top</button>
    <button class="role-btn" data-role="Jungla">Jungla</button>
    <button class="role-btn" data-role="Mid">Mid</button>
    <button class="role-btn" data-role="ADC">ADC</button>
    <button class="role-btn" data-role="Support">Support</button>
  </nav>

  <main id="mainView">
    <section id="championGrid" class="champion-grid"></section>
    <section id="championDetail" class="champion-detail hidden"></section>
    <section id="tierlistView" class="hidden"></section>
    <section id="seasonsView" class="hidden"></section>
  </main>

  <footer class="footer">
    <p>ShadowMeta — builds, runas, maestrías y tier lists de League of Legends · iconos oficiales vía Data Dragon · proyecto de fan, sin relación con Riot Games</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
